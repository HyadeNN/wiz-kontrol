name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build exe
        shell: pwsh
        run: .\scripts\build.ps1
      - name: Attach to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = "dist/WiZ Kontrol.exe"
          Copy-Item $exe "dist/WiZ-Kontrol-${{ github.ref_name }}.exe"
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --title "WiZ Kontrol ${{ github.ref_name }}" --generate-notes
          }
          gh release upload "${{ github.ref_name }}" "dist/WiZ-Kontrol-${{ github.ref_name }}.exe" --clobber
